<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community – Nothosaur</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .feed-container { max-width: 680px; margin: 0 auto; padding: 16px 14px 40px; }
    .feed-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .feed-header h1 { font-size:1.4rem; }
    .post-card { background:#121212; border:1px solid #252525; border-radius:14px; margin-bottom:20px; overflow:hidden; }
    .post-body { padding:14px 16px; }
    .post-title { font-size:1.05rem; font-weight:650; margin-bottom:6px; }
    .post-text { font-size:0.92rem; color:#9a9a9a; margin-bottom:10px; }
    .empty-feed { text-align:center; padding:50px 20px; color:#9a9a9a; }
    .vid-wrap { position:relative; background:#000; }
    .vid-wrap { width:100%; aspect-ratio: 3/4; max-height:75vh; overflow:hidden; background:#000; }
    .vid-wrap video { width:100%; height:100%; object-fit:cover; display:block; background:#000; }
    .unmute-btn {
      position:absolute; right:12px; bottom:12px; z-index:2;
      background:rgba(0,0,0,0.65); color:#fff; border:1px solid #fff;
      border-radius:20px; padding:8px 14px; font-size:0.85rem; cursor:pointer;
    }
  </style>
</head>
<body style="background:#0a0a0a;color:#f5f5f5;font-family:system-ui,sans-serif;margin:0;">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span style="color:#ff1493;font-weight:700;">NOTHOSAUR</span></a>
      <div class="header-actions">
        <button class="menu-toggle" onclick="document.getElementById('mobile-nav').classList.toggle('open')" style="background:none;border:none;color:#fff;font-size:1.4rem;">☰</button>
      </div>
    </div>
    <div class="mobile-nav" id="mobile-nav">
      <a href="index.html">Home</a>
      <a href="collections.html">Shop All</a>
      <a href="community.html">Community</a>
      <a href="login.html">Sign In</a>
    </div>
  </header>
  <div class="feed-container">
    <div class="feed-header"><h1>Community</h1></div>
    <div id="feed-list"><div class="empty-feed">Loading...</div></div>
  </div>
  <script>
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function mediaHtml(p){
      var url = p.mediaUrl || '';
      if(p.type === 'video'){
        if(url.indexOf('youtube.com')>-1||url.indexOf('youtu.be')>-1){
          var vid=url;
          if(vid.indexOf('watch?v=')>-1) vid=vid.split('watch?v=')[1].split('&')[0];
          else if(vid.indexOf('youtu.be/')>-1) vid=vid.split('youtu.be/')[1].split('?')[0];
          return '<div style="position:relative;padding-bottom:56.25%;height:0;background:#000;"><iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=1&mute=1&playsinline=1&loop=1&rel=0" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
        }
        return '<div class="vid-wrap"><video src="'+esc(url)+'" autoplay muted loop playsinline preload="auto"></video><button class="unmute-btn" onclick="var v=this.previousElementSibling;v.muted=!v.muted;this.textContent=v.muted?\'取消静音\':\'静音\'">取消静音</button></div>';
      }
      return '<img src="'+esc(url)+'" style="width:100%;display:block;background:#0d0d0d;" onerror="this.style.display=\'none\'">';
    }
    fetch('js/posts.json?t='+Date.now()).then(function(r){return r.json()}).then(function(posts){
      var el=document.getElementById('feed-list');
      posts=Array.isArray(posts)?posts.filter(function(p){return p.published!==false}):[];
      if(!posts.length){el.innerHTML='<div class="empty-feed">No posts yet.</div>';return;}
      el.innerHTML=posts.map(function(p){
        return '<div class="post-card">'+mediaHtml(p)+'<div class="post-body"><div class="post-title">'+esc(p.title)+'</div><div class="post-text">'+esc(p.content||'')+'</div></div></div>';
      }).join('');
    }).catch(function(){document.getElementById('feed-list').innerHTML='<div class="empty-feed">Failed to load.</div>';});
  </script>
<script src="js/i18n.js"></script>
</body>
</html>
