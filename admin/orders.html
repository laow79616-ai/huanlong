<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 – Nothosaur 后台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>
  (function(){
    if (sessionStorage.getItem('nothosaur_admin_session') !== '1') {
      location.href = 'login.html';
    }
  })();
  </script>
  <style>
    .filter-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .filter-bar select, .filter-bar input {
      padding:8px 12px; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#e6edf3; font-size:0.9rem;
    }
    .status-select {
      padding:4px 8px; background:#0d1117; border:1px solid #30363d; border-radius:4px; color:#e6edf3; font-size:0.8rem;
    }
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:300;
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:#161b22; border:1px solid #30363d; border-radius:12px;
      width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:24px;
    }
    .modal h2 { font-size:1.15rem; margin-bottom:18px; color:#ff1493; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:0.8rem; color:#8b949e; margin-bottom:6px; font-weight:600; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:10px 12px; background:#0d1117; border:1px solid #30363d;
      border-radius:6px; color:#e6edf3; font-size:0.95rem; font-family:inherit; box-sizing:border-box;
    }
    .form-group textarea { min-height:70px; resize:vertical; }
    .ship-info { font-size:0.78rem; color:#8b949e; margin-top:4px; line-height:1.4; }
    .ship-info strong { color:#86efac; }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo" style="color:#ff1493;font-weight:700;font-size:1.1rem;padding:0 20px 22px;border-bottom:1px solid #30363d;margin-bottom:14px;">
        NOTHOSAUR 后台
      </div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="products.html">商品管理</a>
        <a href="orders.html" class="active">订单管理</a>
        <a href="members.html">会员列表</a>
        <a href="inquiries.html">客户咨询</a>
        <a href="content.html">内容发布</a>
        <a href="stats.html">数据统计</a>
        <a href="settings.html">系统设置</a>
        <a href="../index.html" style="margin-top:24px;color:#ff1493;">← 返回前台</a>
        <a href="login.html" onclick="sessionStorage.removeItem('nothosaur_admin_session')" style="color:#f87171;">退出登录</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>订单管理</h1>
        <button class="btn" style="padding:10px 18px;font-size:0.88rem;" onclick="addDemoOrder()">+ 模拟新订单</button>
      </div>

      <div class="filter-bar">
        <select id="filter-status" onchange="renderOrders()">
          <option value="">全部状态</option>
          <option value="pending">待发货</option>
          <option value="shipped">已发货</option>
          <option value="completed">已完成</option>
          <option value="cancelled">已取消</option>
        </select>
        <input type="text" id="filter-search" placeholder="搜索订单号 / 客户" oninput="renderOrders()" style="min-width:180px;">
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>订单号</th>
            <th>客户</th>
            <th>商品</th>
            <th>金额</th>
            <th>状态 / 物流</th>
            <th>时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="orders-list"></tbody>
      </table>
      <div style="margin-top:24px;font-size:0.85rem;color:#8b949e;">
        共 <span id="order-count">0</span> 条订单
      </div>
    </main>
  </div>

  <!-- 发货弹窗 -->
  <div class="modal-overlay" id="ship-modal">
    <div class="modal">
      <h2>填写物流信息</h2>
      <input type="hidden" id="ship-order-id">
      <div class="form-group">
        <label>订单号</label>
        <input type="text" id="ship-order-display" disabled>
      </div>
      <div class="form-group">
        <label>物流公司 *</label>
        <select id="ship-carrier">
          <option value="">请选择</option>
          <option value="YunExpress">云途物流 YunExpress</option>
          <option value="4PX">递四方 4PX</option>
          <option value="Yanwen">燕文物流 Yanwen</option>
          <option value="DHL">DHL</option>
          <option value="FedEx">FedEx</option>
          <option value="UPS">UPS</option>
          <option value="USPS">USPS</option>
          <option value="China Post">中国邮政</option>
          <option value="SF International">顺丰国际</option>
          <option value="Other">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>运单号 *</label>
        <input type="text" id="ship-tracking" placeholder="输入运单号">
      </div>
      <div class="form-group">
        <label>发货备注</label>
        <textarea id="ship-note" placeholder="可选：如发货时间、包装说明等"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
        <button style="padding:10px 16px;background:transparent;border:1px solid #30363d;color:#e6edf3;border-radius:6px;cursor:pointer;" onclick="closeShipModal()">取消</button>
        <button class="btn" style="padding:10px 18px;" onclick="saveShipping()">确认发货</button>
      </div>
    </div>
  </div>

  <script>
    const defaultOrders = [
      { id: 'NS-20260825-01', customer: 'A***n', product: 'Ignis (M / Medium)', amount: 89.99, status: 'shipped', time: '2026-08-25 14:22', shipping: { carrier: 'YunExpress', tracking: 'YT123456789CN', note: '' } },
      { id: 'NS-20260825-02', customer: 'L***a', product: 'Alla (L / Soft)', amount: 79.99, status: 'pending', time: '2026-08-25 13:05' },
      { id: 'NS-20260824-18', customer: 'K***o', product: 'Necrons (XL / Firm)', amount: 99.99, status: 'shipped', time: '2026-08-24 19:40', shipping: { carrier: '4PX', tracking: '4PX987654321', note: '' } },
      { id: 'NS-20260824-15', customer: 'M***s', product: 'Serpentis (M / Medium)', amount: 84.99, status: 'completed', time: '2026-08-24 11:18', shipping: { carrier: 'Yanwen', tracking: 'YT000111222CN', note: '' } }
    ];

    function getOrders() {
      const saved = localStorage.getItem('nothosaur_demo_orders');
      if (saved) return JSON.parse(saved);
      localStorage.setItem('nothosaur_demo_orders', JSON.stringify(defaultOrders));
      return defaultOrders;
    }
    function saveOrders(list) {
      localStorage.setItem('nothosaur_demo_orders', JSON.stringify(list));
    }

    function statusLabel(s) {
      return { pending:'待发货', shipped:'已发货', completed:'已完成', cancelled:'已取消' }[s] || s;
    }

    function trackUrl(carrier, tracking) {
      if (!tracking) return '';
      const t = encodeURIComponent(tracking);
      // 通用 17track
      return 'https://www.17track.net/en/track?nums=' + t;
    }

    function renderOrders() {
      let list = getOrders();
      const status = document.getElementById('filter-status').value;
      const keyword = document.getElementById('filter-search').value.trim().toLowerCase();
      if (status) list = list.filter(o => o.status === status);
      if (keyword) list = list.filter(o => o.id.toLowerCase().includes(keyword) || (o.customer||'').toLowerCase().includes(keyword));

      document.getElementById('order-count').textContent = list.length;
      document.getElementById('orders-list').innerHTML = list.map(o => {
        const ship = o.shipping || {};
        let shipHtml = '';
        if (ship.tracking) {
          const url = trackUrl(ship.carrier, ship.tracking);
          shipHtml = `<div class="ship-info"><strong>${ship.carrier || '物流'}</strong>: <a href="${url}" target="_blank" style="color:#58a6ff;">${ship.tracking}</a>${ship.note ? '<br>' + ship.note : ''}</div>`;
        }
        return `
        <tr>
          <td>#${o.id}</td>
          <td>${o.customer || '-'}${o.shipping && o.shipping.name ? '<div class="ship-info">' + o.shipping.name + '</div>' : ''}</td>
          <td>${o.product || '-'}</td>
          <td>$${Number(o.amount||0).toFixed(2)}</td>
          <td>
            <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
              <option value="pending" ${o.status==='pending'?'selected':''}>待发货</option>
              <option value="shipped" ${o.status==='shipped'?'selected':''}>已发货</option>
              <option value="completed" ${o.status==='completed'?'selected':''}>已完成</option>
              <option value="cancelled" ${o.status==='cancelled'?'selected':''}>已取消</option>
            </select>
            ${shipHtml}
          </td>
          <td>${o.time || '-'}</td>
          <td style="white-space:nowrap;">
            <button style="background:none;border:1px solid #30363d;color:#86efac;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:0.78rem;margin-right:4px;" onclick="openShipModal('${o.id}')">发货</button>
            <button style="background:none;border:1px solid #30363d;color:#f87171;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:0.78rem;" onclick="deleteOrder('${o.id}')">删除</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="7" style="text-align:center;padding:40px;color:#8b949e;">暂无订单</td></tr>';
    }

    function updateStatus(id, status) {
      const list = getOrders();
      const idx = list.findIndex(o => o.id === id);
      if (idx > -1) {
        list[idx].status = status;
        saveOrders(list);
        renderOrders();
      }
    }

    function openShipModal(id) {
      const o = getOrders().find(x => x.id === id);
      if (!o) return;
      document.getElementById('ship-order-id').value = id;
      document.getElementById('ship-order-display').value = '#' + id;
      const ship = o.shipping || {};
      document.getElementById('ship-carrier').value = ship.carrier || '';
      document.getElementById('ship-tracking').value = ship.tracking || '';
      document.getElementById('ship-note').value = ship.note || '';
      document.getElementById('ship-modal').classList.add('open');
    }

    function closeShipModal() {
      document.getElementById('ship-modal').classList.remove('open');
    }

    function saveShipping() {
      const id = document.getElementById('ship-order-id').value;
      const carrier = document.getElementById('ship-carrier').value;
      const tracking = document.getElementById('ship-tracking').value.trim();
      const note = document.getElementById('ship-note').value.trim();
      if (!carrier) { alert('请选择物流公司'); return; }
      if (!tracking) { alert('请填写运单号'); return; }

      const list = getOrders();
      const idx = list.findIndex(o => o.id === id);
      if (idx < 0) return;

      // 保留原有收货地址信息
      const prev = list[idx].shipping || {};
      list[idx].shipping = {
        ...prev,
        carrier,
        tracking,
        note,
        shippedAt: new Date().toISOString()
      };
      list[idx].status = 'shipped';
      saveOrders(list);
      closeShipModal();
      renderOrders();
      alert('已保存物流信息，订单状态改为「已发货」');
    }

    function deleteOrder(id) {
      if (!confirm('确定删除此订单？')) return;
      saveOrders(getOrders().filter(o => o.id !== id));
      renderOrders();
    }

    function addDemoOrder() {
      const list = getOrders();
      const now = new Date();
      const id = 'NS-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*90)+10);
      list.unshift({
        id, customer: 'T***m', product: 'Ignis (M / Medium)', amount: 89.99,
        status: 'pending', time: now.toISOString().slice(0,16).replace('T',' ')
      });
      saveOrders(list);
      renderOrders();
    }

    document.getElementById('ship-modal').addEventListener('click', function(e) {
      if (e.target === this) closeShipModal();
    });

    renderOrders();
  </script>
</body>
</html>
