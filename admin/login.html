<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 – Nothosaur</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body.admin-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 28px;
      margin: 20px;
    }
    .login-card h1 {
      font-size: 1.3rem;
      color: #ff1493;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-card .sub {
      text-align: center;
      color: #8b949e;
      font-size: 0.88rem;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 6px; font-weight: 600;
    }
    .form-group input {
      width: 100%; padding: 12px 14px; background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; color: #e6edf3; font-size: 0.95rem; box-sizing: border-box;
    }
    .form-group input:focus { outline: none; border-color: #ff1493; }
    .error {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35);
      color: #f87171; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem;
      margin-bottom: 14px; display: none;
    }
    .btn {
      width: 100%; padding: 12px; background: #ff1493; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body class="admin-body">
  <div class="login-card">
    <h1>NOTHOSAUR 后台</h1>
    <div class="sub">管理员登录</div>
    <div class="error" id="error"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" onclick="doLogin()">登录</button>
  </div>
  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'Ab123456789';
    const ADMIN_SESSION = 'nothosaur_admin_session';

    // 已登录则跳转
    if (sessionStorage.getItem(ADMIN_SESSION) === '1') {
      location.href = 'index.html';
    }

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('error');
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem(ADMIN_SESSION, '1');
        location.href = 'index.html';
      } else {
        err.textContent = '用户名或密码错误';
        err.style.display = 'block';
      }
    }
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
