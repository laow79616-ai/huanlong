<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计 – Nothosaur 后台</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>
  (function(){
    if (sessionStorage.getItem('nothosaur_admin_session') !== '1') {
      location.href = 'login.html';
    }
  })();
  </script>
  <style>
    .bar-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.9rem;
    }
    .bar-label { width: 90px; flex-shrink: 0; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 18px; background: #0d1117; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #ff1493, #ff4db8); border-radius: 4px; min-width: 2px; }
    .bar-value { width: 48px; text-align: right; color: #8b949e; font-size: 0.85rem; }
    .card-block {
      background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px; margin-bottom: 20px;
    }
    .card-block h2 { font-size: 1rem; margin-bottom: 16px; }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo" style="color:#ff1493;font-weight:700;font-size:1.1rem;padding:0 20px 22px;border-bottom:1px solid #30363d;margin-bottom:14px;">
        NOTHOSAUR 后台
      </div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="products.html">商品管理</a>
        <a href="orders.html">订单管理</a>
        <a href="members.html">会员列表</a>
        <a href="inquiries.html">客户咨询</a>
        <a href="content.html">内容发布</a>
        <a href="stats.html" class="active">数据统计</a>
        <a href="settings.html">系统设置</a>
        <a href="../index.html" style="margin-top:24px;color:#ff1493;">← 返回前台</a>
        <a href="login.html" onclick="sessionStorage.removeItem('nothosaur_admin_session')" style="color:#f87171;">退出登录</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>数据统计</h1>
        <span style="font-size:0.85rem;color:#8b949e;">基于真实订单 / 会员数据</span>
      </div>

      <div class="stats-grid" style="margin-bottom:24px;">
        <div class="stat-card">
          <div class="label">全部订单</div>
          <div class="value" id="stat-orders">0</div>
        </div>
        <div class="stat-card">
          <div class="label">总销售额</div>
          <div class="value" id="stat-revenue">$0</div>
        </div>
        <div class="stat-card">
          <div class="label">客单价</div>
          <div class="value" id="stat-aov">$0</div>
        </div>
        <div class="stat-card">
          <div class="label">注册会员</div>
          <div class="value" id="stat-members">0</div>
        </div>
      </div>

      <div class="stats-grid" style="margin-bottom:24px;">
        <div class="stat-card">
          <div class="label">待发货</div>
          <div class="value" id="stat-pending" style="color:#eab308;">0</div>
        </div>
        <div class="stat-card">
          <div class="label">已发货</div>
          <div class="value" id="stat-shipped" style="color:#22c55e;">0</div>
        </div>
        <div class="stat-card">
          <div class="label">已完成</div>
          <div class="value" id="stat-completed">0</div>
        </div>
        <div class="stat-card">
          <div class="label">社区内容</div>
          <div class="value" id="stat-posts">0</div>
        </div>
      </div>

      <div class="card-block">
        <h2>热销商品（按订单出现次数）</h2>
        <div id="hot-products"><div style="color:#8b949e;padding:12px 0;">暂无订单数据</div></div>
      </div>

      <div class="card-block">
        <h2>近 7 日订单趋势</h2>
        <div id="trend-days"><div style="color:#8b949e;padding:12px 0;">暂无订单数据</div></div>
      </div>

      <div class="card-block">
        <h2>订单状态分布</h2>
        <div id="status-dist"></div>
      </div>
    </main>
  </div>

  <script>
    function getOrders() {
      try { return JSON.parse(localStorage.getItem('nothosaur_demo_orders') || '[]'); }
      catch(e) { return []; }
    }
    function getUsers() {
      try { return JSON.parse(localStorage.getItem('nothosaur_demo_users') || '[]'); }
      catch(e) { return []; }
    }
    function getPosts() {
      try { return JSON.parse(localStorage.getItem('nothosaur_demo_posts') || '[]'); }
      catch(e) { return []; }
    }

    function render() {
      const orders = getOrders();
      const users = getUsers();
      const posts = getPosts();

      const totalRevenue = orders.reduce((s, o) => s + Number(o.amount || 0), 0);
      const aov = orders.length ? totalRevenue / orders.length : 0;

      document.getElementById('stat-orders').textContent = orders.length;
      document.getElementById('stat-revenue').textContent = '$' + totalRevenue.toFixed(0);
      document.getElementById('stat-aov').textContent = '$' + aov.toFixed(1);
      document.getElementById('stat-members').textContent = users.length;

      const pending = orders.filter(o => o.status === 'pending').length;
      const shipped = orders.filter(o => o.status === 'shipped').length;
      const completed = orders.filter(o => o.status === 'completed').length;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-shipped').textContent = shipped;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-posts').textContent = posts.length;

      // 热销：从 product 字段粗略拆分商品名
      const productCount = {};
      orders.forEach(o => {
        const raw = (o.product || '').split(',')[0].trim();
        // 取括号前名称
        const name = raw.replace(/\s*\(.*$/, '').replace(/\s*×.*$/, '').trim() || 'Unknown';
        productCount[name] = (productCount[name] || 0) + 1;
      });
      const sorted = Object.entries(productCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const maxP = sorted.length ? sorted[0][1] : 1;
      const hotEl = document.getElementById('hot-products');
      if (!sorted.length) {
        hotEl.innerHTML = '<div style="color:#8b949e;padding:12px 0;">暂无订单数据</div>';
      } else {
        hotEl.innerHTML = sorted.map(([name, cnt]) => `
          <div class="bar-row">
            <div class="bar-label" title="${name}">${name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt / maxP * 100)}%"></div></div>
            <div class="bar-value">${cnt} 单</div>
          </div>
        `).join('');
      }

      // 近 7 日
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const label = key.slice(5);
        const count = orders.filter(o => (o.time || '').startsWith(key) || (o.time || '').slice(0, 10) === key).length;
        days.push({ label, count });
      }
      // 也匹配 MM-DD 简写
      days.forEach(day => {
        if (day.count === 0) {
          day.count = orders.filter(o => {
            const t = o.time || '';
            return t.includes(day.label) || t.startsWith('2026-' + day.label) || t.startsWith('2025-' + day.label);
          }).length;
        }
      });
      const maxD = Math.max(...days.map(d => d.count), 1);
      document.getElementById('trend-days').innerHTML = days.map(d => `
        <div class="bar-row">
          <div class="bar-label">${d.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.count / maxD * 100)}%"></div></div>
          <div class="bar-value">${d.count}</div>
        </div>
      `).join('');

      // 状态分布
      const statuses = [
        { key: 'pending', label: '待发货', color: '#eab308' },
        { key: 'shipped', label: '已发货', color: '#22c55e' },
        { key: 'completed', label: '已完成', color: '#ff1493' },
        { key: 'cancelled', label: '已取消', color: '#f87171' }
      ];
      const maxS = Math.max(pending, shipped, completed, orders.filter(o => o.status === 'cancelled').length, 1);
      document.getElementById('status-dist').innerHTML = statuses.map(s => {
        const c = orders.filter(o => o.status === s.key).length;
        return `
          <div class="bar-row">
            <div class="bar-label">${s.label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c / maxS * 100)}%;background:${s.color}"></div></div>
            <div class="bar-value">${c}</div>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
