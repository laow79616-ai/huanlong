<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All – Nothosaur Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40" fill="none"><path d="M20 4 C12 8 6 16 8 26 C10 32 16 36 20 36 C24 36 30 32 32 26 C34 16 28 8 20 4 Z" fill="#ff1493"/></svg>
        <span>NOTHOSAUR</span>
      </a>
      <nav class="nav">
        <a href="collections.html" class="active">Shop All</a>
        <a href="collections.html">Dildos</a>
        <a href="collections.html">New Releases</a>
        <a href="collections.html">Available Now</a>
        <a href="#">Info & Rewards</a>
      </nav>
      <div class="header-actions">
        <button title="Search">🔍</button>
        <button title="Account" onclick="location.href=(localStorage.getItem('nothosaur_demo_session')? 'account.html':'login.html')" >👤</button>
        <button onclick="openCart()" title="Cart">🛒 <span class="cart-count" style="display:none">0</span></button>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>
    <div class="mobile-nav" id="mobile-nav">
      <a href="login.html">Sign In</a>
      <a href="register.html">Register</a>
      <a href="account.html">My Account</a>

      <a href="index.html">Home</a>
      <a href="collections.html">Shop All</a>
      <a href="community.html">Community</a>
      </div>
  </header>

  <section class="section">
    <div class="section-header">
      <h1 class="section-title">All <span>Designs</span></h1>
      <span style="color:var(--text-muted);font-size:0.9rem;">6 products</span>
    </div>
    <div class="product-grid" id="all-products"></div>
  </section>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;margin:0;padding:24px 0;">
      © 2026 Framework Demo · For demonstration purposes only
    </div>
  </footer>

  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button onclick="closeCart()" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cart-total-price">$0.00</span></div>
      <button class="btn" style="width:100%;" onclick="location.href='checkout.html'">Checkout</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
